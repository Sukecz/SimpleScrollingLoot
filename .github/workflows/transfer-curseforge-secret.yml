name: Transfer CurseForge publishing secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest

    steps:
      - name: Transfer secret to Better Loot Rolls
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRET_TRANSFER_GH_TOKEN }}
        run: |
          if [[ -z "$CF_API_TOKEN" || -z "$GH_TOKEN" ]]; then
            echo "Required transfer secrets are unavailable."
            exit 1
          fi

          printf '%s' "$CF_API_TOKEN" |
            gh secret set CF_API_TOKEN --repo Sukecz/Better-Loot-Rolls
